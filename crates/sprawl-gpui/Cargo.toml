[package]
name = "sprawl-gpui"
version = "0.2.0"
description = "A disk space visualizer"
edition = "2024"

[[bin]]
name = "sprawl-gpui"
path = "src/main.rs"

[dependencies]
sprawl-core = { path = "../sprawl-core" }
gpui = "=0.2.2"
dirs = "7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
