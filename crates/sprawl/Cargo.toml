[package]
name = "sprawl"
version.workspace = true
description = "A disk space visualizer"
edition = "2024"

[[bin]]
name = "sprawl"
path = "src/main.rs"

[features]
default = []
dev-flags = []

[dependencies]
sprawl-core = { path = "../sprawl-core" }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "wayland", "x11"] }
dirs = "7"
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-segmentation = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "=0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }


[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
