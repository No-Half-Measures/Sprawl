[package]
name = "sprawl-core"
version = "0.2.0"
edition = "2024"

[lib]
name = "sprawl_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12.0"
sysinfo = "0.39.6"
bincode = { version = "2", features = ["serde"] }
zstd = "0.13"
dirs = "7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
