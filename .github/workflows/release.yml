name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: bash packaging/linux/install-deps.sh
      - name: Version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml | grep '^version *=' | sed 's/.*"\([^"]*\)".*/\1/')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p target/assets
      - name: Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --release --workspace --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./packaging/windows/build-installer.ps1 -Version $env:VERSION -OutDir target/assets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item target/release/sprawl-cli.exe target/assets/sprawl-cli-windows-x64.exe
          Copy-Item scripts/install-cli.ps1 target/assets/sprawl-cli-install.ps1
      - name: Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --release --workspace --locked
          mkdir -p target/linux-package
          cp target/release/sprawl target/release/sprawl-cli packaging/linux/sprawl.desktop crates/sprawl/assets/icon.png LICENSE NOTICE target/linux-package/
          tar -czf "target/assets/Sprawl_${VERSION}_linux-x64.tar.gz" -C target/linux-package .
          tar -czf target/assets/sprawl-cli-linux-x64.tar.gz -C target/release sprawl-cli
          (cd skills && zip -r ../target/assets/sprawl-skill.zip sprawl)
      - name: macOS packages
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --workspace --locked --target "$target"
          done
          mkdir -p target/universal target/macos/Sprawl.app/Contents/{MacOS,Resources}
          for binary in sprawl sprawl-cli; do
            lipo -create -output "target/universal/$binary" "target/aarch64-apple-darwin/release/$binary" "target/x86_64-apple-darwin/release/$binary"
          done
          cp target/universal/sprawl target/macos/Sprawl.app/Contents/MacOS/
          cp crates/sprawl/assets/icon.icns target/macos/Sprawl.app/Contents/Resources/
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > target/macos/Sprawl.app/Contents/Info.plist
          codesign --force --deep --sign - target/macos/Sprawl.app
          cp target/universal/sprawl-cli LICENSE NOTICE target/macos/
          hdiutil create -volname Sprawl -srcfolder target/macos -ov -format UDZO "target/assets/Sprawl_${VERSION}_universal.dmg"
          tar -czf target/assets/sprawl-cli-macos-universal.tar.gz -C target/universal sprawl-cli
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: target/assets/*
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --title "Sprawl $GITHUB_REF_NAME" --notes "See the assets below to download and install Sprawl."
          gh release upload "$GITHUB_REF_NAME" assets/*
