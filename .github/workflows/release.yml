name: Release
on:
  push:
    tags: ['v*']

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-22.04
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Sprawl ${{ github.ref_name }}
          releaseBody: See the assets below to download and install Sprawl.
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Build and upload CLI
        shell: bash
        working-directory: src-tauri
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$RUNNER_OS" in
            Windows)
              cargo build --release --bin sprawl-cli
              asset=sprawl-cli-windows-x64.exe
              cp target/release/sprawl-cli.exe "$asset"
              ;;
            Linux)
              cargo build --release --bin sprawl-cli
              asset=sprawl-cli-linux-x64.tar.gz
              tar -czf "$asset" -C target/release sprawl-cli
              ;;
            macOS)
              for target in aarch64-apple-darwin x86_64-apple-darwin; do
                cargo build --release --bin sprawl-cli --target "$target"
              done
              lipo -create -output sprawl-cli \
                target/aarch64-apple-darwin/release/sprawl-cli \
                target/x86_64-apple-darwin/release/sprawl-cli
              asset=sprawl-cli-macos-universal.tar.gz
              tar -czf "$asset" sprawl-cli
              ;;
          esac
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
      - name: Upload agent skill
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd skills && zip -r ../sprawl-skill.zip sprawl)
          gh release upload "$GITHUB_REF_NAME" sprawl-skill.zip --clobber
