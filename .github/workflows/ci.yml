name: CI
on:
  push:
    branches: [gpui, master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: bash packaging/linux/install-deps.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo clippy -p sprawl --all-targets --features dev-flags -- -D warnings
      - run: cargo test -p sprawl --features dev-flags
      - if: runner.os == 'Linux'
        run: cargo build
